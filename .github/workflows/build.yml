name: Build Nintendo 3DS game

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build .3dsx
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          make

      - name: Upload Homebrew Launcher build
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFight3DS-homebrew
          path: |
            ShadowFight3DS.3dsx
            ShadowFight3DS.elf
          if-no-files-found: error
          retention-days: 14
